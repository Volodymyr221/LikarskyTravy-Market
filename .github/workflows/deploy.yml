# Автодеплой: кожен push у main → збірка Next.js (статичний експорт) → GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export NEXT_PUBLIC_BUILD_TIME="$(TZ=Europe/Kyiv date +'%d.%m %H:%M')"
          # нова версія кешу service worker на кожен деплой — телефони не тримають старий код
          sed -i "s/const CACHE_NAME = \"zbir-v1\"/const CACHE_NAME = \"zbir-v${{ github.run_number }}\"/" public/sw.js
          grep -q "zbir-v${{ github.run_number }}" public/sw.js
          npm run build
          touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
